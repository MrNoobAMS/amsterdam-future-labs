<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 956" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="score" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fb5a9"/>
      <stop offset="1" stop-color="#127a72"/>
    </linearGradient>
  </defs>
  <rect width="440" height="956" fill="#f5f8f7"/>
  <text x="30" y="48" font-size="15" font-weight="600" fill="#10312e">9:41</text>
  <rect x="360" y="36" width="24" height="12" rx="3" fill="none" stroke="#10312e" stroke-width="1.5" opacity="0.7"/>
  <rect x="362" y="38" width="16" height="8" rx="1.5" fill="#10312e" opacity="0.7"/>

  <text x="30" y="104" font-size="13" fill="#5e7773">Magnesiumcitraat · 120 caps</text>
  <text x="30" y="136" font-size="26" font-weight="700" fill="#10312e">Kwaliteitsscore</text>

  <!-- score hero -->
  <rect x="30" y="164" width="380" height="150" rx="22" fill="url(#score)"/>
  <circle cx="105" cy="239" r="48" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8"/>
  <path d="M105 191a48 48 0 1 1-38 76" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <text x="105" y="248" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">8.4</text>
  <text x="175" y="222" font-size="16" font-weight="700" fill="#ffffff">Goede keuze</text>
  <text x="175" y="248" font-size="12" fill="#d3efec">Goed gedoseerd, sterk bewijs,</text>
  <text x="175" y="266" font-size="12" fill="#d3efec">transparante fabrikant.</text>

  <!-- criteria -->
  <text x="30" y="360" font-size="18" font-weight="700" fill="#10312e">Opbouw van de score</text>
  <g>
    <rect x="30" y="380" width="380" height="66" rx="16" fill="#ffffff"/>
    <text x="46" y="406" font-size="14" font-weight="600" fill="#10312e">Dosering</text>
    <text x="394" y="406" font-size="13" font-weight="700" fill="#127a72" text-anchor="end">9.1</text>
    <rect x="46" y="420" width="348" height="8" rx="4" fill="#e3efed"/>
    <rect x="46" y="420" width="317" height="8" rx="4" fill="#1fb5a9"/>
  </g>
  <g>
    <rect x="30" y="458" width="380" height="66" rx="16" fill="#ffffff"/>
    <text x="46" y="484" font-size="14" font-weight="600" fill="#10312e">Wetenschappelijk bewijs</text>
    <text x="394" y="484" font-size="13" font-weight="700" fill="#127a72" text-anchor="end">8.6</text>
    <rect x="46" y="498" width="348" height="8" rx="4" fill="#e3efed"/>
    <rect x="46" y="498" width="299" height="8" rx="4" fill="#1fb5a9"/>
  </g>
  <g>
    <rect x="30" y="536" width="380" height="66" rx="16" fill="#ffffff"/>
    <text x="46" y="562" font-size="14" font-weight="600" fill="#10312e">Transparantie fabrikant</text>
    <text x="394" y="562" font-size="13" font-weight="700" fill="#127a72" text-anchor="end">8.2</text>
    <rect x="46" y="576" width="348" height="8" rx="4" fill="#e3efed"/>
    <rect x="46" y="576" width="285" height="8" rx="4" fill="#1fb5a9"/>
  </g>
  <g>
    <rect x="30" y="614" width="380" height="66" rx="16" fill="#ffffff"/>
    <text x="46" y="640" font-size="14" font-weight="600" fill="#10312e">Onnodige toevoegingen</text>
    <text x="394" y="640" font-size="13" font-weight="700" fill="#d98f2b" text-anchor="end">6.8</text>
    <rect x="46" y="654" width="348" height="8" rx="4" fill="#e3efed"/>
    <rect x="46" y="654" width="237" height="8" rx="4" fill="#f2a93c"/>
  </g>

  <!-- evidence footer -->
  <rect x="30" y="700" width="380" height="64" rx="16" fill="#ffffff"/>
  <text x="46" y="727" font-size="12" font-weight="600" fill="#127a72">Bronnen</text>
  <text x="46" y="747" font-size="12" fill="#5e7773">EFSA · NIH · PubMed · Cochrane — per claim gekoppeld</text>

  <rect x="0" y="868" width="440" height="88" fill="#ffffff"/>
  <circle cx="66" cy="904" r="4" fill="#199e94"/>
  <text x="44" y="932" font-size="10" fill="#127a72">Ontdek</text>
