<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 956" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="440" height="956" fill="#0d1f1d"/>
  <text x="30" y="48" font-size="15" font-weight="600" fill="#eaf4f2">9:41</text>
  <rect x="360" y="36" width="24" height="12" rx="3" fill="none" stroke="#eaf4f2" stroke-width="1.5" opacity="0.8"/>
  <rect x="362" y="38" width="16" height="8" rx="1.5" fill="#eaf4f2" opacity="0.8"/>

  <text x="220" y="110" font-size="20" font-weight="700" fill="#eaf4f2" text-anchor="middle">Scan een barcode</text>
  <text x="220" y="136" font-size="13" fill="#9db8b4" text-anchor="middle">Richt je camera op de streepjescode</text>

  <!-- camera viewport -->
  <rect x="40" y="170" width="360" height="470" rx="26" fill="#152e2b"/>
