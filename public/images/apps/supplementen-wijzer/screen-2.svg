  <path d="M90 250v-30a10 10 0 0 1 10-10h30" fill="none" stroke="#1fb5a9" stroke-width="4" stroke-linecap="round"/>
  <path d="M350 250v-30a10 10 0 0 0-10-10h-30" fill="none" stroke="#1fb5a9" stroke-width="4" stroke-linecap="round"/>
  <path d="M90 560v30a10 10 0 0 0 10 10h30" fill="none" stroke="#1fb5a9" stroke-width="4" stroke-linecap="round"/>
  <path d="M350 560v30a10 10 0 0 1-10 10h-30" fill="none" stroke="#1fb5a9" stroke-width="4" stroke-linecap="round"/>
  <!-- barcode -->
  <g fill="#eaf4f2" opacity="0.9">
    <rect x="150" y="360" width="5" height="90"/><rect x="160" y="360" width="2" height="90"/>
    <rect x="167" y="360" width="7" height="90"/><rect x="179" y="360" width="3" height="90"/>
    <rect x="187" y="360" width="5" height="90"/><rect x="198" y="360" width="2" height="90"/>
    <rect x="205" y="360" width="8" height="90"/><rect x="218" y="360" width="3" height="90"/>
    <rect x="226" y="360" width="5" height="90"/><rect x="236" y="360" width="7" height="90"/>
    <rect x="248" y="360" width="2" height="90"/><rect x="255" y="360" width="5" height="90"/>
    <rect x="265" y="360" width="3" height="90"/><rect x="273" y="360" width="8" height="90"/>
    <rect x="286" y="360" width="4" height="90"/>
  </g>
  <!-- scan line -->
  <rect x="100" y="398" width="240" height="3" rx="1.5" fill="#1fb5a9"/>

  <!-- recognized card -->
  <rect x="40" y="668" width="360" height="120" rx="22" fill="#ffffff"/>
  <rect x="60" y="692" width="52" height="72" rx="10" fill="#e3efed"/>
  <g transform="rotate(-30 86 728)">
    <rect x="72" y="718" width="28" height="14" rx="7" fill="#127a72"/>
    <rect x="72" y="718" width="14" height="14" rx="7" fill="#1fb5a9"/>
  </g>
  <text x="130" y="712" font-size="15" font-weight="700" fill="#10312e">Magnesiumcitraat 400</text>
  <text x="130" y="734" font-size="12" fill="#5e7773">Herkend · score wordt berekend…</text>
  <rect x="130" y="748" width="90" height="8" rx="4" fill="#e3efed"/>
  <rect x="130" y="748" width="58" height="8" rx="4" fill="#1fb5a9"/>

  <rect x="0" y="868" width="440" height="88" fill="#122926"/>
  <text x="44" y="932" font-size="10" fill="#7f9d98">Ontdek</text>
  <circle cx="172" cy="904" r="4" fill="#1fb5a9"/>
  <text x="150" y="932" font-size="10" fill="#1fb5a9">Scanner</text>
  <text x="256" y="932" font-size="10" fill="#7f9d98">Mijn stack</text>
  <text x="366" y="932" font-size="10" fill="#7f9d98">Assistent</text>
