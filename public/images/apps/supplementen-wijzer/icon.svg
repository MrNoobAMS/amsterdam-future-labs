      <stop offset="0" stop-color="#1fb5a9"/>
      <stop offset="1" stop-color="#127a72"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8f2ef"/>
