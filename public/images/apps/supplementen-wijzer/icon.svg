    <rect x="26" y="34" width="22" height="24" rx="12" fill="#0e5a54" opacity="0.85"/>
    <line x1="48" y1="34" x2="48" y2="58" stroke="#127a72" stroke-width="1.5" opacity="0.4"/>
  </g>
  <!-- score badge -->
