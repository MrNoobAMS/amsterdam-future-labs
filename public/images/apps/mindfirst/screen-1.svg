<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 956" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="sos" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e05252"/>
      <stop offset="1" stop-color="#c23a3a"/>
    </linearGradient>
  </defs>
  <rect width="440" height="956" fill="#f2f7f6"/>
  <text x="30" y="48" font-size="15" font-weight="600" fill="#173934">9:41</text>
  <rect x="360" y="36" width="24" height="12" rx="3" fill="none" stroke="#173934" stroke-width="1.5" opacity="0.7"/>
  <rect x="362" y="38" width="16" height="8" rx="1.5" fill="#173934" opacity="0.7"/>

  <text x="30" y="112" font-size="15" fill="#5f7a75">Mentale eerste hulp</text>
  <text x="30" y="144" font-size="27" font-weight="700" fill="#173934">Wat speelt er nu?</text>

  <!-- protocol cards -->
  <g>
    <rect x="30" y="180" width="185" height="150" rx="22" fill="#ffffff"/>
    <circle cx="66" cy="222" r="18" fill="#e3f2ef"/>
    <path d="M58 222c3-6 13-6 16 0" fill="none" stroke="#56c2b3" stroke-width="2.4" stroke-linecap="round"/>
    <text x="48" y="272" font-size="16" font-weight="700" fill="#173934">Paniek</text>
    <text x="48" y="294" font-size="12" fill="#5f7a75">Adem en grond</text>
  </g>
  <g>
    <rect x="225" y="180" width="185" height="150" rx="22" fill="#ffffff"/>
    <circle cx="261" cy="222" r="18" fill="#e3f2ef"/>
    <circle cx="261" cy="222" r="7" fill="none" stroke="#56c2b3" stroke-width="2.4"/>
    <text x="243" y="272" font-size="16" font-weight="700" fill="#173934">Dissociatie</text>
    <text x="243" y="294" font-size="12" fill="#5f7a75">Terug naar het nu</text>
  </g>
  <g>
    <rect x="30" y="342" width="185" height="150" rx="22" fill="#ffffff"/>
    <circle cx="66" cy="384" r="18" fill="#e3f2ef"/>
    <path d="M57 384h18M60 378h12M60 390h12" stroke="#56c2b3" stroke-width="2.2" stroke-linecap="round"/>
    <text x="48" y="434" font-size="16" font-weight="700" fill="#173934">Overprikkeling</text>
    <text x="48" y="456" font-size="12" fill="#5f7a75">Minder, zachter</text>
  </g>
  <g>
    <rect x="225" y="342" width="185" height="150" rx="22" fill="#ffffff"/>
    <circle cx="261" cy="384" r="18" fill="#e3f2ef"/>
    <path d="M261 377v9m0 5v.5" stroke="#56c2b3" stroke-width="2.6" stroke-linecap="round"/>
    <text x="243" y="434" font-size="16" font-weight="700" fill="#173934">Crisisgevoel</text>
    <text x="243" y="456" font-size="12" fill="#5f7a75">Stap voor stap</text>
  </g>

  <!-- safety plan shortcut -->
  <rect x="30" y="512" width="380" height="76" rx="20" fill="#ffffff"/>
  <circle cx="66" cy="550" r="16" fill="#e3f2ef"/>
  <path d="M60 550l4 4 8-8" fill="none" stroke="#56c2b3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="96" y="544" font-size="15" font-weight="600" fill="#173934">Mijn veiligheidsplan</text>
  <text x="96" y="566" font-size="12" fill="#5f7a75">Wat mij eerder heeft geholpen</text>

  <!-- reassurance -->
  <text x="220" y="640" font-size="13" fill="#5f7a75" text-anchor="middle">Dit gaat voorbij. Je hoeft het niet alleen te doen.</text>

  <!-- SOS button -->
  <rect x="70" y="756" width="300" height="64" rx="32" fill="url(#sos)"/>
  <text x="220" y="796" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">SOS — bel een vertrouwd contact</text>

  <rect x="0" y="868" width="440" height="88" fill="#ffffff"/>
  <circle cx="80" cy="904" r="4" fill="#56c2b3"/>
  <text x="62" y="932" font-size="10" fill="#2e8b8b">Hulp</text>
  <text x="196" y="932" font-size="10" fill="#8fa8a3">Plan</text>
  <text x="336" y="932" font-size="10" fill="#8fa8a3">Contacten</text>
</svg>
