<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 956" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="440" height="956" fill="#f4f6f4"/>
  <text x="30" y="48" font-size="15" font-weight="600" fill="#12312f">9:41</text>
  <rect x="360" y="36" width="24" height="12" rx="3" fill="none" stroke="#12312f" stroke-width="1.5" opacity="0.7"/>
  <rect x="362" y="38" width="16" height="8" rx="1.5" fill="#12312f" opacity="0.7"/>

  <text x="30" y="104" font-size="13" fill="#5c7370">Module 2 · Les 1</text>
  <text x="30" y="136" font-size="26" font-weight="700" fill="#12312f">Je eerste goede prompt</text>

  <!-- explanation -->
  <rect x="30" y="164" width="380" height="140" rx="18" fill="#ffffff"/>
  <text x="46" y="192" font-size="13" font-weight="600" fill="#216b6b">Uitleg</text>
  <text x="46" y="216" font-size="13" fill="#41544f">Een goede prompt heeft drie delen: wie de AI</text>
  <text x="46" y="236" font-size="13" fill="#41544f">is, wat je precies wilt, en hoe het antwoord</text>
  <text x="46" y="256" font-size="13" fill="#41544f">eruit moet zien. Je hoeft niets te weten van</text>
  <text x="46" y="276" font-size="13" fill="#41544f">techniek — helder vragen is genoeg.</text>

  <!-- practice prompt -->
  <rect x="30" y="320" width="380" height="168" rx="18" fill="#12312f"/>
  <text x="46" y="350" font-size="13" font-weight="600" fill="#7fc7c7">Oefenprompt</text>
  <text x="46" y="376" font-size="13" fill="#d7e8e5">“Je bent een geduldige kok. Maak een</text>
  <text x="46" y="396" font-size="13" fill="#d7e8e5">weekmenu voor 2 personen, budget €60.</text>
  <text x="46" y="416" font-size="13" fill="#d7e8e5">Zet het in een tabel per dag.”</text>
  <rect x="46" y="436" width="128" height="34" rx="17" fill="#216b6b"/>
  <text x="110" y="458" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Kopieer prompt</text>

  <!-- homework -->
  <rect x="30" y="504" width="380" height="96" rx="18" fill="#ffffff"/>
  <text x="46" y="532" font-size="13" font-weight="600" fill="#216b6b">Huiswerk</text>
  <text x="46" y="556" font-size="13" fill="#41544f">Probeer de prompt en verander één detail —</text>
  <text x="46" y="576" font-size="13" fill="#41544f">bijvoorbeeld het budget. Wat verandert er?</text>

  <!-- reflection -->
  <rect x="30" y="616" width="380" height="96" rx="18" fill="#ffffff"/>
  <text x="46" y="644" font-size="13" font-weight="600" fill="#216b6b">Reflectie</text>
  <text x="46" y="668" font-size="13" fill="#41544f">Welk deel van je prompt had het meeste</text>
  <text x="46" y="688" font-size="13" fill="#41544f">effect op het antwoord?</text>

  <!-- complete button -->
  <rect x="30" y="744" width="380" height="52" rx="26" fill="#216b6b"/>
  <text x="220" y="776" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Les afronden</text>

  <rect x="0" y="868" width="440" height="88" fill="#ffffff"/>
  <circle cx="62" cy="904" r="4" fill="#216b6b"/>
  <text x="42" y="932" font-size="10" fill="#216b6b">Leerpad</text>
  <text x="126" y="932" font-size="10" fill="#8aa19d">Prompts</text>
  <text x="212" y="932" font-size="10" fill="#8aa19d">Opdrachten</text>
  <text x="308" y="932" font-size="10" fill="#8aa19d">Voortgang</text>
  <text x="388" y="932" font-size="10" fill="#8aa19d">Meer</text>
</svg>
